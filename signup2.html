<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup2</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="container">

        <div class="image"><img src="./photos/magic.png"></div>

        <div class="content">

            <div class="topic">

                <div class="logo">
                    <div class="logo-icon orange"><img src="./photos/logo-Icon.png" alt="icon"></div>
                    <div class="logo-content">
                        <div class="upper">RIH<span>LA</span></div>
                        <div class="lower">EGYPT TRAVEL</div>
                    </div>
                </div>

                <h2>Reset Password</h2>
                <p>Sign in to your account to continue your journey</p>

            </div>  

            <div class="login">

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password">
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password">
                    </div>
                </div>

                <button class="login-btn">Reset Password</button>

            </div>

        </div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot password</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="container">

        <div class="image"><img src="./photos/magic.png"></div>

        <div class="content">

            <div class="topic">

                <div class="logo">
                    <div class="logo-icon orange"><img src="./photos/logo-Icon.png" alt="icon"></div>
                    <div class="logo-content">
                        <div class="upper">RIH<span>LA</span></div>
                        <div class="lower">EGYPT TRAVEL</div>
                    </div>
                </div>

                <h2>Forgot Password?</h2>
                <p>Sign in to your account to continue your journey</p>

            </div>  

            <div class="login">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>

                <button class="login-btn">Send Verification Code</button>

            </div>

        </div>
    </div>
    
</body>
</html>

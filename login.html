<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="container">

        <div class="image"><img src="./photos/magic.png"></div>

        <div class="content">

            <div class="topic">

                <div class="logo">
                    <div class="logo-icon orange"><img src="./photos/logo-Icon.png" alt="icon"></div>
                    <div class="logo-content">
                        <div class="upper">RIH<span>LA</span></div>
                        <div class="lower">EGYPT TRAVEL</div>
                    </div>
                </div>

                <h2>Welcome Back</h2>

                <p>Sign in to your account to continue your journey</p>

            </div>  

            <div class="login">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password">
                    </div>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="" class="forgot-password">Forgot password?</a>
                </div>

                <button class="login-btn">Login</button>

                <div class="divider">
                    <span>Or continue with</span>
                </div>
            
                <div class="btns">
                    <button><img src="./photos/google.png" alt="icon">Google</button>
                    <button><img src="./photos/apple.png">Apple</button>
                </div>

                <div class="other">
                    <p class="other1">Don't have an account? </p>
                    <p class="other2">Create account</p>
                </div>

            </div>

        </div>
    </div>
    
</body>
</html>
